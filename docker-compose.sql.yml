include:
    # Rspamd + ClamAV + Postfix — the mail-flow stack this service hands outbound/inbound mail off to.
    # Folded in via `include` (not a second `-f` flag) so `docker compose -f docker-compose.sql.yml up`
    # alone brings up a fully working deployment — see .claude/NOTES.md for the end-to-end wiring notes.
    - docker-compose.mail.yml

services:
    server:
        image: rapidmx-server:local
        build:
            context: .
        command: ["node", "dist/src/server.sql.js"]
        ports:
            - "3000:3000"
            - "9229:9229"
        environment:
            - datastores__acl__url=postgres://postgres:postgres@postgres:5432/${SERVER_SQL_DB_NAME:-rapidmx_server}
            - datastores__cache__type=redis
            - datastores__cache__url=redis://redis/0
            - datastores__events__type=redis
            - datastores__events__url=redis://redis/0
            - datastores__logs__type=redis
            - datastores__logs__url=redis://redis/0
            - datastores__sql__url=postgres://postgres:postgres@postgres:5432/${SERVER_SQL_DB_NAME:-rapidmx_server}
            # Must match auth-server's own `auth__secret`/`auth__options__*` below exactly, or every JWT
            # auth-server issues fails signature/audience/issuer verification here. See .claude/NOTES.md
            # ("Authentication is out of scope for this repo") for why this service never issues its own.
            - auth__secret=${AUTH_SECRET:-MyPasswordIsSecure}
            - auth__options__audience=${AUTH_AUDIENCE:-mydomain.com}
            - auth__options__issuer=${AUTH_ISSUER:-api.mydomain.com}
            - cookie_secret=${COOKIE_SECRET:-f0fLSKFJLKWJFe09f32joff098u2fOFIWJ32890fnfnlak}
            # Browser-facing: apps/www's/apps/admin's unauthenticated-redirect and this service's own SSR
            # both resolve auth-server through this URL, so it must be reachable from the visitor's browser,
            # not just from inside the compose network (hence localhost:3001, not http://auth-server:3000).
            # Override with the real public auth-server URL in any deployment that isn't single-host/dev.
            - mail__auth_server_url=${AUTH_SERVER_PUBLIC_URL:-http://localhost:3001}
            - NODE_ENV=${NODE_ENV:-dev}
        volumes:
            # `mail:blob:local:root` (./data/blobs, relative to /app) — raw MIME sources, attachments,
            # contact photos. Must be persistent in any real deployment or every message body/attachment
            # is lost on container recreation.
            - blob_data:/app/data
        links:
            - redis
            - postgres
            - auth-server
        depends_on:
            - auth-server
    auth-server:
        image: ghcr.io/rapidrest/auth-server:${AUTH_SERVER_IMAGE_TAG:-latest}
        command: ["node", "dist/src/server.sql.js"]
        ports:
            - "3001:3000"
        environment:
            - datastores__acl__url=postgres://postgres:postgres@postgres:5432/${AUTH_SERVER_SQL_DB_NAME:-rapidmx_auth}
            - datastores__cache__type=redis
            - datastores__cache__url=redis://redis/1
            - datastores__events__type=redis
            - datastores__events__url=redis://redis/1
            - datastores__logs__type=redis
            - datastores__logs__url=redis://redis/1
            - datastores__sql__url=postgres://postgres:postgres@postgres:5432/${AUTH_SERVER_SQL_DB_NAME:-rapidmx_auth}
            - auth__secret=${AUTH_SECRET:-MyPasswordIsSecure}
            - auth__options__audience=${AUTH_AUDIENCE:-mydomain.com}
            - auth__options__issuer=${AUTH_ISSUER:-api.mydomain.com}
            # auth-server's own OAuth-authorization-server issuer/origin (distinct from the JWT
            # audience/issuer pair above — see auth-server's own config.sql.ts) — its public URL too.
            - auth__oauth_server__issuer=${AUTH_SERVER_PUBLIC_URL:-http://localhost:3001}
            - auth__oauth_server__keys__encryption_key=${AUTH_OAUTH_SERVER_ENCRYPTION_KEY:-96aa4879e304e525b74141bf1bc072c17e2b90c5b35250a2d18cbd2b8d4172ac}
            - session__secret=${SESSION_SECRET:-SessionsHaveSecrets}
            - cookie_secret=${COOKIE_SECRET:-f0fLSKFJLKWJFe09f32joff098u2fOFIWJ32890fnfnlak}
            - NODE_ENV=${NODE_ENV:-dev}
        links:
            - redis
            - postgres
    redis:
        image: redis
    postgres:
        image: postgres
        environment:
            - POSTGRES_PASSWORD=postgres
        volumes:
            # Creates the `rapidmx_server`/`rapidmx_auth` databases on first boot of a fresh data volume —
            # see docker/postgres-init.sql. Has no effect against an already-initialized data volume; drop
            # and recreate it (or run the two `CREATE DATABASE` statements manually) if adding this to an
            # existing deployment.
            - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
            # NOT /var/lib/postgresql/data - the postgres:18+ image refuses to start at all if anything is
            # externally mounted directly at that exact path ("these Docker images are configured to store
            # database data in a format which is compatible with pg_ctlcluster... there appears to be
            # PostgreSQL data in /var/lib/postgresql/data (unused mount/volume)"), even an empty freshly-
            # created volume - confirmed live, this crash-looped both this service and auth-server. The
            # image wants the *parent* directory so it can manage its own major-version-qualified
            # subdirectory underneath it.
            - postgres_data:/var/lib/postgresql

volumes:
    blob_data:
    postgres_data:
