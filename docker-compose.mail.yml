services:
    server:
        environment:
            - mail__scan__spam__rspamd__url=http://rspamd:11333
            - mail__scan__av__clamav__host=clamav
            - mail__scan__av__clamav__port=3310
            - mail__transport__ingest__secret=${MAIL_INGEST_SECRET:-ChangeMeIngestSecret}
        links:
            - rspamd
            - clamav
            - postfix
        depends_on:
            - rspamd
            - clamav
            - postfix
    # Anti-spam scoring (SpamScanProvider) — see RspamdSpamScanProvider. Exposes its HTTP checkv2 API on 11333.
    rspamd:
        image: rspamd/rspamd:latest
        ports:
            - "11333:11333"
    # Anti-virus scanning (AvScanProvider) — see ClamAvScanProvider. clamd's signature database can take a
    # few minutes to load on first start; the provider fails closed (quarantines) until it's ready.
    clamav:
        image: clamav/clamav:stable
        ports:
            - "3310:3310"
    # The MTA — real inbound/outbound SMTP is intentionally out of scope for @rapidmx/restapi itself (see its
    # README); this is the "dedicated MTA" it hands off to. `PostfixSendmailTransport` shells out to a local
    # `sendmail` binary for OUTBOUND mail, so the `server` image needs one installed and configured to relay
    # through this container (not yet wired here — a Dockerfile/postfix-client follow-up, tracked in
    # .claude/NOTES.md). INBOUND delivery (Postfix -> `POST /internal/mta/deliver`) additionally needs this
    # container's own `main.cf`/`master.cf` configured with a content-filter/recipient-validation policy that
    # calls `GET /internal/mta/resolve` and hands accepted mail to `POST /internal/mta/deliver` — also not yet
    # authored here; this service currently only stands up a working Postfix instance to build that on top of.
    postfix:
        image: boky/postfix:latest
        environment:
            - ALLOWED_SENDER_DOMAINS=example.com
        ports:
            - "25:25"
