---
# Exposes rspamd's HTTP checkv2 API for RspamdSpamScanProvider (mail__scan__spam__rspamd__url). Distinct
# from the rspamd bundled inside `boky/postfix` (DKIM signing) - that Deployment, along with Postfix and
# postfix-bridge itself, now lives in the separate `postfix-bridge` chart, deployed alongside this one.
apiVersion: v1
kind: Service
metadata:
  name: rspamd
spec:
  ports:
    - port: 11333
      targetPort: 11333
      name: http
  selector:
    app: rspamd
---
# Exposes clamd for ClamAvScanProvider (mail__scan__av__clamav__host/port).
apiVersion: v1
kind: Service
metadata:
  name: clamav
spec:
  ports:
    - port: 3310
      targetPort: 3310
      name: clamd
  selector:
    app: clamav
