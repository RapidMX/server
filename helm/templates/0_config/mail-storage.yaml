---
# See values.yaml's mail.dkim.storage doc comment for the ReadWriteOnce/ReadWriteMany tradeoff. Written by
# the main service Deployment (1_deployments/service.yaml, FsDkimKeyProvider) and read by rspamd's
# dkim_signing module inside the separate `postfix-bridge` chart's own Postfix Deployment - since that's
# now a different Helm release, this PVC is only ever mounted by this chart's own Deployment; point
# postfix-bridge's own `mail.dkim.storage` at the same underlying storage (e.g. an existing PVC/NFS-backed
# volume) for DKIM signing to actually see what FsDkimKeyProvider writes here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rrst.fullname" . }}-dkim-keys
spec:
  accessModes:
    - {{ .Values.mail.dkim.storage.accessMode }}
  {{- if ne .Values.mail.dkim.storage.storageClassName "default" }}
  storageClassName: {{ tpl .Values.mail.dkim.storage.storageClassName . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mail.dkim.storage.size }}
---
# LocalFsBlobStore's root - only ever mounted by the main service Deployment, so this is always safe as
# ReadWriteOnce regardless of cluster topology (unlike dkim-keys above).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rrst.fullname" . }}-blob-data
spec:
  accessModes:
    - {{ .Values.mail.blob.storage.accessMode }}
  {{- if ne .Values.mail.blob.storage.storageClassName "default" }}
  storageClassName: {{ tpl .Values.mail.blob.storage.storageClassName . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mail.blob.storage.size }}
