---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rrst.fullname" . }}-mail-ingest-secret
type: Opaque
data:
  # Bearer secret authenticating mta-bridge's calls to this service's /internal/mta routes (see
  # mta-bridge.yaml). A real secret in production, like every other one on this page - not the usual
  # `lookup`-then-generate-if-missing dance jwt-auth.yaml uses, since (unlike that value) nothing else
  # ever needs to independently re-derive this one to agree with it - it's just consumed verbatim by both
  # sides from this one Secret.
  mail__transport__ingest__secret: {{ tpl .Values.mail.ingestSecret . | b64enc | quote }}
