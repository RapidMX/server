apiVersion: v2
description: Installs the RapidMX mail server - webmail, ActiveSync, MAPI, and Autodiscover - along with its supporting auth-server, Postfix/rspamd/ClamAV mail stack, and mta-bridge, into a Kubernetes cluster
name: mail-server
version: 1.0.0
appVersion: "0.1.0"
dependencies:

- name: mongodb
  repository: "@bitnami"
  version: ~18.4.4
  condition: mongodb.create
  tags:
    - dbs
    - mongodb
  alias: mongodb

- name: postgresql
  repository: "@bitnami"
  version: ~18.8.13
  condition: postgresql.create
  tags:
    - dbs
    - postgresql
  alias: postgresql

- name: redis
  version: ~24.1.3
  repository: "@bitnami"
  condition: redis.create
  tags:
    - cache
    - redis
  alias: redis

# The separate auth-server deployment this service verifies JWTs against (see .claude/NOTES.md,
# "Authentication is out of scope for this repo") - co-installed as a subchart by default so one `helm
# install` brings up the whole stack, matching docker-compose.mongo.yml/sql.yml's own auth-server wiring.
# Its own mongodb/redis/postgresql subchart creation is disabled via values.yaml (authServer.mongodb.create
# etc.) in favor of sharing this chart's own instances, on separate logical databases - see values.yaml's
# authServer block for the full wiring, and its own chart's gateway.create toggle (values.yaml's
# authServer.gateway.create: false) for how the two charts share one Gateway without colliding.
- name: auth-server
  repository: "oci://ghcr.io/rapidrest/charts"
  version: ~1.0.0
  condition: authServer.create
  alias: authServer

