host: localhost
environment: dev
auth:
  audience: mail-server-api
  issuer: mail-server-api
  expiresIn: 1 hour
  secret: MyPasswordIsSecure
cookies:
  secret: '{{ randAlphaNum 32 }}'
sessions:
  secret: '{{ randAlphaNum 32 }}'
common:
  storageClass: default
  logs:
    level: info
gateway:
  create: true
  name: api-gateway
  namespace: '{{ .Release.Namespace }}'
  hsts: true
  tls: true
redis:
  create: true
  url: redis://db-redis-master
  architecture: standalone
  auth:
    enabled: true
  fullnameOverride: db-redis
  master:
    persistence:
      enabled: false
  replica:
    persistence:
      enabled: false
  networkPolicy:
    enabled: true
    allowExternal: false
mongodb:
  create: true
  architecture: standalone
  fullnameOverride: mongodb
  auth:
    enabled: true
postgresql:
  create: false
  architecture: standalone
  fullnameOverride: postgresql
  auth:
    enablePostgresUser: true
    database: rapidmx_server
service:
  image:
    registry: ghcr.io
    repository: rapidmx/server
    tag: 1.0.0-beta.0
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  mongodb:
    acl:
      name: rapidmx_server_acls
      host: ''
    mongo:
      name: rapidmx_server_mongo
      host: ''
  postgresql:
    acl:
      name: postgres
      host: ''
    sql:
      name: rapidmx_server
      host: ''
  config:
    logs: true
    metrics: true
    releaseNotes: true
    mail__dkim__key_dir: /var/lib/rspamd/dkim
    mail__dkim__selector: mail
    mail__scan__spam__rspamd__url: http://rspamd:11333
    mail__scan__av__clamav__host: clamav
    mail__scan__av__clamav__port: 3310
authServer:
  create: true
  host: auth.localhost
  environment: dev
  gateway:
    create: false
  auth:
    audience: mail-server-api
    issuer: mail-server-api
    expiresIn: 1 hour
    secret: MyPasswordIsSecure
  mongodb:
    create: false
    fullnameOverride: mongodb
  redis:
    create: false
    fullnameOverride: db-redis
    url: redis://db-redis-master
    auth:
      enabled: true
  postgresql:
    create: false
    fullnameOverride: postgresql
  service:
    image:
      registry: ghcr.io
      repository: rapidrest/auth-server
      tag: ''
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    mongodb:
      acl:
        name: rapidmx_auth_acls
        host: ''
      mongo:
        name: rapidmx_auth_mongo
        host: ''
    postgresql:
      acl:
        name: postgres
        host: ''
      sql:
        name: rapidmx_auth
        host: ''
    config:
      logs: true
      metrics: true
      releaseNotes: true
mail:
  ingestSecret: ChangeMeIngestSecret
  domains: example.com
  hostname: mail.localhost
  dkim:
    selector: mail
    autogenerate: true
    storage:
      storageClassName: '{{ .Values.common.storageClass }}'
      accessMode: ReadWriteOnce
      size: 1Gi
  blob:
    storage:
      storageClassName: '{{ .Values.common.storageClass }}'
      accessMode: ReadWriteOnce
      size: 20Gi
  postfix:
    image:
      registry: docker.io
      repository: boky/postfix
      tag: latest
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    serviceType: LoadBalancer
  rspamd:
    image:
      registry: docker.io
      repository: rspamd/rspamd
      tag: latest
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
  clamav:
    image:
      registry: docker.io
      repository: clamav/clamav
      tag: stable
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
  mtaBridge:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
