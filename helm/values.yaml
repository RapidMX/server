host: localhost
environment: dev
auth:
  # A stable logical API identifier, not meant to be a real hostname (matching config.defaults.ts's own
  # "mydomain.com"/"api.mydomain.com" placeholders) - deliberately NOT derived from `host`, unlike this
  # scaffold's original default, so it can never silently drift from authServer.auth.audience/issuer
  # below just because `host`/`authServer.host` differ (Kubernetes Gateway routing needs a distinct
  # subdomain for authServer - see that field's own comment - but the two chart's must still agree
  # exactly on `aud`/`iss` for JWT verification to succeed at all).
  audience: mail-server-api
  issuer: mail-server-api
  expiresIn: 1 hour
  # Verified against, not issued by, this service (see .claude/NOTES.md, "Authentication is out of scope
  # for this repo") - must be the exact same value as authServer.auth.secret below, which is why this is a
  # fixed literal rather than the usual `{{ randAlphaNum 32 }}` (two independent random-per-chart secrets
  # would never actually match). Override BOTH together for a real deployment - `--set
  # auth.secret=<value>,authServer.auth.secret=<same value>` - the app itself refuses to boot in
  # production with this default in effect (assertProductionSecretsAreSet()).
  secret: MyPasswordIsSecure
cookies:
  secret: '{{ randAlphaNum 32 }}'
sessions:
  secret: '{{ randAlphaNum 32 }}'
common:
  storageClass: default
  logs:
    level: info
gateway:
  create: true
  name: api-gateway
  namespace: '{{ .Release.Namespace }}'
  hsts: true
  tls: true

redis:
  create: true
  url: 'redis://db-redis-master'
  architecture: standalone
  auth:
    enabled: true
  fullnameOverride: db-redis
  master:
    persistence:
      enabled: false
  replica:
    persistence:
      enabled: false
  networkPolicy:
    enabled: true
    allowExternal: false


mongodb:
  create: true
  architecture: standalone
  fullnameOverride: mongodb
  auth:
    enabled: true

postgresql:
  create: false
  architecture: standalone
  fullnameOverride: postgresql
  auth:
    enablePostgresUser: true
    # PostgreSQL (unlike MongoDB) won't create databases on first connection, so only one
    # extra database is auto-provisioned here. The acl datastore below defaults to the
    # built-in "postgres" database; override service.postgresql.acl.name if you provision a
    # dedicated database for it out-of-band.
    database: rapidmx_server

service:
  image:
    registry: ghcr.io
    repository: rapidmx/server
    tag: ""
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  mongodb:
    acl:
      name: rapidmx_server_acls
      host: ''
    mongo:
      name: rapidmx_server_mongo
      host: ''
  postgresql:
    acl:
      name: postgres
      host: ''
    sql:
      name: rapidmx_server
      host: ''
  config:
    logs: true
    metrics: true
    releaseNotes: true
    # Consumed by the registered DkimKeyProvider (FsDkimKeyProvider) - must match rspamd's own DKIM
    # signing path/selector exactly (see the dkim block below and the dkim-keys PVC both server and
    # postfix mount). mail__scan__* point at the rspamd/clamav Services this chart also creates.
    mail__dkim__key_dir: /var/lib/rspamd/dkim
    mail__dkim__selector: mail
    mail__scan__spam__rspamd__url: http://rspamd:11333
    mail__scan__av__clamav__host: clamav
    mail__scan__av__clamav__port: 3310

# The separate auth-server deployment this service verifies JWTs against - see Chart.yaml's own comment
# on the auth-server dependency, and .claude/NOTES.md's "Authentication is out of scope for this repo".
# Sharing this chart's own mongodb/redis (mongodb.create/redis.create above) on separate logical
# databases, rather than each chart creating its own - the fullnameOverride values below MUST match this
# chart's own mongodb.fullnameOverride/redis.fullnameOverride exactly, or auth-server's own
# service-config.yaml template (which looks up datastore credentials by that exact resource name) won't
# find them.
authServer:
  create: true
  # A distinct subdomain of the same public host, not a different port (docker-compose.mongo.yml/sql.yml
  # uses localhost:3001 for exactly the same purpose, but Kubernetes Gateway routing is hostname-based) -
  # this chart's own 3_gateways/api.yaml Gateway has no per-listener hostname restriction specifically so
  # both this chart's own HTTPRoute and authServer's can attach to it side by side.
  #
  # IMPORTANT: Helm subchart values are a static YAML merge, not a live reference back to this chart's own
  # values - a `'{{ .Values.host }}'`-style string here would be re-evaluated INSIDE authServer's own
  # template context (where `.Values.host` means authServer's own, now-overridden `host` field), not
  # against this chart's. Every field below is therefore a plain literal, kept in sync with this chart's
  # own corresponding value by hand/comment, not by cross-referencing it.
  host: auth.localhost
  # Keep in sync with the top-level `environment` value above, for the same reason as `host`.
  environment: dev
  gateway:
    # This chart's own Gateway (created above) is the one shared Gateway - authServer must not also
    # create a second resource literally named "api-gateway" in the same namespace. authServer's own
    # gateway.name/namespace defaults (api-gateway / {{ .Release.Namespace }}) already point its
    # HTTPRoute at that same shared Gateway unchanged, so nothing else needs overriding here.
    create: false
  auth:
    # Must be IDENTICAL to .Values.auth.audience/issuer/secret above - not derived from `host`/
    # authServer.host precisely so it can't silently drift just because those differ (see this chart's
    # own auth.audience doc comment). JWT verification fails outright the moment these two charts
    # disagree on any of the three.
    audience: mail-server-api
    issuer: mail-server-api
    expiresIn: 1 hour
    secret: MyPasswordIsSecure
  # Share this chart's own mongodb/redis (mongodb.create/redis.create above) on separate logical
  # databases (service.mongodb.* below), rather than each chart creating its own - fullnameOverride must
  # be an identical literal copy of this chart's own mongodb.fullnameOverride/redis.fullnameOverride
  # (same "no live cross-reference" limitation as `host` above), or authServer's own service-config.yaml
  # template (which looks up datastore credentials by that exact resource name) won't find them.
  mongodb:
    create: false
    fullnameOverride: mongodb
  redis:
    create: false
    fullnameOverride: db-redis
    url: 'redis://db-redis-master'
    auth:
      enabled: true
  postgresql:
    create: false
    fullnameOverride: postgresql
  service:
    image:
      registry: ghcr.io
      repository: rapidrest/auth-server
      tag: ""
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    mongodb:
      acl:
        name: rapidmx_auth_acls
        host: ''
      mongo:
        name: rapidmx_auth_mongo
        host: ''
    postgresql:
      acl:
        name: postgres
        host: ''
      sql:
        name: rapidmx_auth
        host: ''
    config:
      logs: true
      metrics: true
      releaseNotes: true

# The mail-flow stack (Postfix, rspamd, ClamAV) and mta-bridge - see docker-compose.mail.yml for the
# equivalent docker-compose wiring these Kubernetes resources mirror.
mail:
  # Bearer secret authenticating mta-bridge's calls to this service's /internal/mta routes - a real
  # secret in production, like every other one on this page (see mail-ingest-secret.yaml).
  ingestSecret: ChangeMeIngestSecret
  # Comma-separated domains Postfix accepts/relays OUTBOUND submissions for (ALLOWED_SENDER_DOMAINS) -
  # keep in sync with the Domains added via the admin console. Independent of INBOUND acceptance, which
  # mta-bridge backs dynamically from this app's own Domain database - see postfix.yaml's own comment.
  domains: example.com
  # Postfix's public MX hostname - drives both its HELO/EHLO identity (POSTFIX_myhostname) and the TLS
  # certificate's CN/dnsNames (see mail-tls-certs.yaml). Left at a `.local`-style placeholder here, exactly
  # like the top-level `host` default, so a fresh install gets a self-signed dev cert instead of an
  # unobtainable real one (mail-tls-certs.yaml only requests a real cert-manager Certificate once this is
  # overridden to an actual publicly resolvable hostname).
  hostname: mail.localhost
  dkim:
    selector: mail
    # Fallback safety net only - see docker-compose.mail.yml's identical DKIM_AUTOGENERATE comment for
    # why this is normally redundant with FsDkimKeyProvider's own per-Domain generation.
    autogenerate: true
    storage:
      # dkim-keys is mounted read-write by both the main service Deployment (FsDkimKeyProvider writes
      # here) and the postfix Deployment (rspamd's dkim_signing module reads from here) - ReadWriteOnce
      # is enough ONLY if the cluster's scheduler places both pods on the same node, which is always true
      # on a single-node cluster (e.g. single_node_install.sh's k3s) but NOT guaranteed on a real
      # multi-node cluster. Override storageClassName to an RWX-capable class (NFS, EFS, Azure Files,
      # Longhorn, etc.) and accessMode to ReadWriteMany for a genuine multi-node deployment.
      storageClassName: '{{ .Values.common.storageClass }}'
      accessMode: ReadWriteOnce
      size: 1Gi
  blob:
    # LocalFsBlobStore's root (mail:blob:local:root) - raw MIME sources, attachments, contact photos.
    # Only ever mounted by the main service Deployment, so ReadWriteOnce is always sufficient here
    # regardless of cluster topology.
    storage:
      storageClassName: '{{ .Values.common.storageClass }}'
      accessMode: ReadWriteOnce
      size: 20Gi
  postfix:
    image:
      registry: docker.io
      repository: boky/postfix
      tag: latest
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    # Real inbound SMTP needs to be reachable from the public internet - LoadBalancer is the common
    # choice on a real cloud cluster; override to NodePort for a bare-metal/single-node cluster without
    # a cloud load balancer integration (see single_node_install.sh's own nginx-stream-proxy pattern for
    # how port 25 could be forwarded to a NodePort the same way it already does for 80/443).
    serviceType: LoadBalancer
  rspamd:
    image:
      registry: docker.io
      repository: rspamd/rspamd
      tag: latest
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
  clamav:
    image:
      registry: docker.io
      repository: clamav/clamav
      tag: stable
    resources:
      requests:
        cpu: 200m
        # clamd's signature database needs real headroom to load - see docker-compose.mail.yml's own
        # comment on its startup time.
        memory: 1Gi
      limits:
        memory: 2Gi
  mtaBridge:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
